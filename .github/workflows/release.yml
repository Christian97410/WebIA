name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build sidecar
        run: ./scripts/build-sidecar.sh aarch64-apple-darwin

      - name: Build Tauri app (app bundle only)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target aarch64-apple-darwin --bundles app

      - name: List bundle contents
        run: find src-tauri/target/aarch64-apple-darwin/release/bundle -type f | sort

      - name: Create DMG manually
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/WebIA.app"
          DMG_NAME="WebIA_${{ github.ref_name }}_aarch64.dmg"

          # Create a temporary directory for DMG contents
          mkdir -p dmg-contents
          cp -R "$APP_PATH" dmg-contents/
          ln -s /Applications dmg-contents/Applications

          # Create DMG
          hdiutil create -volname "WebIA" \
            -srcfolder dmg-contents \
            -ov -format UDZO \
            "release-assets/${DMG_NAME}"

      - name: Create release with updater JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Collect assets
          mkdir -p release-assets
          cp "$BUNDLE_DIR/macos/"*.tar.gz release-assets/ 2>/dev/null || true

          # Read signature
          SIG_FILE="$BUNDLE_DIR/macos/WebIA.app.tar.gz.sig"
          SIGNATURE=$(cat "$SIG_FILE")

          # Determine tar.gz filename
          TAR_NAME=$(basename "$BUNDLE_DIR/macos/"*.tar.gz)
          URL="https://github.com/Christian97410/WebIA/releases/download/${TAG}/${TAR_NAME}"

          # Generate latest.json
          python3 -c "
          import json
          data = {
            'version': '${VERSION}',
            'notes': 'WebIA ${TAG}',
            'pub_date': '${DATE}',
            'platforms': {
              'darwin-aarch64': {
                'signature': '${SIGNATURE}',
                'url': '${URL}'
              }
            }
          }
          with open('release-assets/latest.json', 'w') as f:
            json.dump(data, f, indent=2)
          "

          cat release-assets/latest.json

          # Create GitHub release
          gh release create "${TAG}" \
            --title "WebIA ${TAG}" \
            --notes "Download the .dmg file below to install WebIA." \
            release-assets/*
