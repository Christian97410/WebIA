name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build sidecar
        run: ./scripts/build-sidecar.sh aarch64-apple-darwin

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target aarch64-apple-darwin

      - name: Prepare release assets
        run: |
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          echo "=== Bundle contents ==="
          find "$BUNDLE_DIR" -type f | sort

          # Copy assets to a clean directory
          mkdir -p release-assets
          cp "$BUNDLE_DIR/dmg/"*.dmg release-assets/
          cp "$BUNDLE_DIR/macos/"*.tar.gz release-assets/
          cp "$BUNDLE_DIR/macos/"*.tar.gz.sig release-assets/ || echo "No .sig file found"

          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Generate updater JSON
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          SIG_FILE=$(ls release-assets/*.tar.gz.sig 2>/dev/null | head -1)
          if [ -n "$SIG_FILE" ]; then
            SIGNATURE=$(cat "$SIG_FILE")
          else
            echo "WARNING: No signature file found, updater won't work"
            SIGNATURE=""
          fi

          TAR_NAME=$(ls release-assets/*.tar.gz | head -1 | xargs basename)
          URL="https://github.com/Christian97410/WebIA/releases/download/${TAG}/${TAR_NAME}"

          cat > release-assets/latest.json <<ENDJSON
          {
            "version": "${VERSION}",
            "notes": "WebIA ${TAG}",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIGNATURE}",
                "url": "${URL}"
              }
            }
          }
          ENDJSON

          python3 -c "import json; d=json.load(open('release-assets/latest.json')); json.dump(d,open('release-assets/latest.json','w'),indent=2)"
          echo "=== latest.json ==="
          cat release-assets/latest.json

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "${TAG}" \
            --title "WebIA ${TAG}" \
            --notes "Download the .dmg file below to install WebIA." \
            release-assets/* \
            || gh release upload "${TAG}" release-assets/* --clobber
